<!doctype html>
<html lang="en" class="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">

<title>Color War Simulator</title>
<meta name="description" content="Pick two colors and two abilities, then watch them fight over the board. 16 abilities, 77 colors. Free, no ads, no sign-up.">
<meta name="theme-color" content="#04040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Color War">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tinkerer0.github.io/color-war/">
<meta property="og:title" content="Color War Simulator">
<meta property="og:description" content="Pick two colors and two abilities, then watch them fight over the board. 16 abilities, 77 colors. Free, no ads, no sign-up.">
<meta property="og:image" content="https://tinkerer0.github.io/color-war/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="web.css">
</head>
<body>
<!-- 시작 전 화면: 미리보기 판 + 두 주인공 + 시간 + 랜덤/시작 -->
<main id="lobby" class="screen">
  <header class="lobbyTop"><div id="mark"><span id="markA">COLOR</span><span id="markB">WAR</span></div>
    <button id="bSettings" class="round small" aria-label="설정" data-en="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button></header>
  <div id="match">
    <button class="side" data-side="a" aria-label="왼쪽 주인공 바꾸기" data-en="Change left fighter"><canvas width="300" height="300"></canvas><div><b></b><small></small><em></em></div></button>
    <div id="vs"><button id="bStart" aria-label="이 대결 시작" data-en="Start this match"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg></button></div>
    <button class="side right" data-side="b" aria-label="오른쪽 주인공 바꾸기" data-en="Change right fighter"><canvas width="300" height="300"></canvas><div><b></b><small></small><em></em></div></button>
  </div>
  <div id="actions">
    <button id="bRandom" aria-label="랜덤으로 시작" data-en="Start a random match"><svg viewBox="0 0 24 24"><use href="#i-dice"/></svg></button>
  </div>
</main>

<!-- 한 주인공 고르기: 큰 미리보기 + 능력 + 색 -->
<section id="picker" class="screen" hidden>
  <header class="top">
    <button id="bBack" class="round" aria-label="돌아가기" data-en="Back"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <button id="bDice1" class="round" aria-label="이쪽만 랜덤" data-en="Randomize this side"><svg viewBox="0 0 24 24"><use href="#i-dice"/></svg></button>
  </header>
  <div id="pickHero"><canvas width="480" height="480"></canvas><div><b></b><small></small><em></em></div></div>
  <div id="abilities"></div>
  <div id="swatches"></div>
  <div id="toast" hidden></div>
</section>

<!-- 대결 화면 -->
<section id="play" class="screen" hidden>
  <header class="top end"><button id="bMenu" class="round small" aria-label="메뉴(멈춤)" data-en="Menu (pause)"><svg viewBox="0 0 24 24"><use href="#i-pause"/></svg></button></header>
  <div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
  <!-- 랜덤 대결 소개: 누가 누구와 싸우는지 잠깐 보여 주고 시작(누르면 바로 시작) -->
  <div id="intro" hidden>
    <div class="who a"><canvas width="240" height="240"></canvas><div><b></b><small></small></div></div>
    <i>VS</i>
    <div class="who b"><canvas width="240" height="240"></canvas><div><b></b><small></small></div></div>
  </div>
  <!-- 멈춤 메뉴: 메뉴 단추를 누르면 판이 멈추고 뜬다 -->
  <div id="menu" hidden>
    <div class="row">
      <button id="bHome" class="round" aria-label="처음 화면" data-en="Home"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg></button>
      <button id="bResume" class="round big" aria-label="이어 보기" data-en="Resume"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg></button>
      <button id="bNext" class="round" aria-label="다음 대결" data-en="Next match"><svg viewBox="0 0 24 24"><use href="#i-next"/></svg></button>
    </div>
    <div class="row">
      <button id="bSound2" class="round small" aria-label="소리" data-en="Sound"><svg viewBox="0 0 24 24" class="i-on"><use href="#i-sound"/></svg><svg viewBox="0 0 24 24" class="i-off"><use href="#i-mute"/></svg></button>
      <button id="bHaptic2" class="round small" aria-label="진동" data-en="Vibration"><svg viewBox="0 0 24 24" class="i-on"><use href="#i-buzz"/></svg><svg viewBox="0 0 24 24" class="i-off"><use href="#i-nobuzz"/></svg></button>
    </div>
  </div>
</section>

<div id="scrim" hidden></div>
<!-- 설정: 시간·소리·진동·규칙 -->
<section id="settings" class="sheet" hidden>
  <div id="times" role="radiogroup" aria-label="제한 시간" data-en="Time limit">
    <button data-t="45"><svg viewBox="0 0 24 24"><use href="#i-clock"/></svg>45</button>
    <button data-t="60"><svg viewBox="0 0 24 24"><use href="#i-clock"/></svg>60</button>
    <button data-t="75"><svg viewBox="0 0 24 24"><use href="#i-clock"/></svg>75</button>
  </div>
  <div class="row">
    <button id="bSound" class="round" aria-label="소리" data-en="Sound"><svg viewBox="0 0 24 24" class="i-on"><use href="#i-sound"/></svg><svg viewBox="0 0 24 24" class="i-off"><use href="#i-mute"/></svg></button>
    <button id="bHaptic" class="round" aria-label="진동" data-en="Vibration"><svg viewBox="0 0 24 24" class="i-on"><use href="#i-buzz"/></svg><svg viewBox="0 0 24 24" class="i-off"><use href="#i-nobuzz"/></svg></button>
  </div>
  <ul>
    <li><svg viewBox="0 0 24 24"><use href="#i-play"/></svg><span data-en="Each enemy cell a unit takes fires its ability, which grows a little every time">유닛이 상대 땅을 먹을 때마다 능력이 발동하고 조금씩 세진다</span></li>
    <li><svg viewBox="0 0 24 24"><use href="#i-lock"/></svg><span data-en="Inner cells held for 15 seconds lock and can't be taken">15초 지킨 안쪽 땅은 잠겨서 뺏기지 않는다</span></li>
    <li><svg viewBox="0 0 24 24"><use href="#i-clock"/></svg><span data-en="When time runs out, the color with more cells wins">시간이 끝나면 땅이 더 많은 쪽이 이긴다</span></li>
  </ul>
  <p class="meta"><a id="adPrivacy" href="#" hidden data-en="Ad privacy options">광고 개인정보 설정</a><span id="adPrivacySep" hidden> · </span><a id="privacy" href="https://github.com/tinkerer0/color-war-support/blob/main/PRIVACY.md" target="_blank" rel="noopener" data-en="Privacy Policy">개인정보 처리방침</a> · <span id="ver"></span></p>
  <button id="bSettingsClose" class="round" aria-label="닫기" data-en="Close"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
</section>

<div id="loading"><b>COLOR WAR</b><i><s></s></i></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-dice" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2zm2.5 3a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm9 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM12 10.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM7.5 15a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm9 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill-rule="evenodd"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.3 2h3.4l.5 2.6a8 8 0 012 1.2l2.5-.9 1.7 3-2 1.7a8 8 0 010 2.4l2 1.7-1.7 3-2.5-.9a8 8 0 01-2 1.2l-.5 2.6h-3.4l-.5-2.6a8 8 0 01-2-1.2l-2.5.9-1.7-3 2-1.7a8 8 0 010-2.4l-2-1.7 1.7-3 2.5.9a8 8 0 012-1.2zM12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z" fill-rule="evenodd"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 4l10 8-10 8zM15 4h4v16h-4z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.5 3.5L17 5l-7 7 7 7-1.5 1.5L7 12z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M5.6 4.2L12 10.6l6.4-6.4 1.4 1.4-6.4 6.4 6.4 6.4-1.4 1.4-6.4-6.4-6.4 6.4-1.4-1.4 6.4-6.4-6.4-6.4z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 2a10 10 0 110 20 10 10 0 010-20zm-1.3 8v8h2.6v-8zm1.3-4.5a1.6 1.6 0 100 3.2 1.6 1.6 0 000-3.2z" fill-rule="evenodd"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 110 20 10 10 0 010-20zm-1.2 4v7l5.2 3.1 1.1-1.9-3.9-2.3V6z" fill-rule="evenodd"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0110 0v3h2v12H5V10zm2.5 0h5V7a2.5 2.5 0 00-5 0z" fill-rule="evenodd"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM15 8.5a5 5 0 010 7l-1.4-1.4a3 3 0 000-4.2zM17.8 5.7a9 9 0 010 12.6l-1.4-1.4a7 7 0 000-9.8z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM15 9.4l1.4-1.4L18.5 10l2.1-2.1L22 9.4l-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></symbol>
  <symbol id="i-buzz" viewBox="0 0 24 24"><path d="M8 3h8a1 1 0 011 1v16a1 1 0 01-1 1H8a1 1 0 01-1-1V4a1 1 0 011-1zM2 8h2v8H2zM20 8h2v8h-2z"/></symbol>
  <symbol id="i-nobuzz" viewBox="0 0 24 24"><path d="M8 3h8a1 1 0 011 1v16a1 1 0 01-1 1H8a1 1 0 01-1-1V4a1 1 0 011-1zM3.3 2l18.7 18.7-1.3 1.3L2 3.3z"/></symbol>
</svg>
<script type="module" src="src/app.js"></script>
</body>
</html>
